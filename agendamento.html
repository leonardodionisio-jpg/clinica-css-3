<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">início</a><br>
            <a href="agendamento.html">agendamento</a>
        </nav>
    </header>
    <main>
        <h2>Agende sua consulta</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo</label>
            <input type="text" name="nome-completo" id="nome">
            <br>
            <label for="email">email</label>
            <input
             type="text" 
             name="email" 
             id="email"
             required
             inputmode="numeric"
             maxlength="15"
             pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
             title="Digite com DD. Ex: (17) 78387-4843 ou 232324354"
             >
            <br>
            <label for="telefone">telefone</label>
            <input type="tel" name="telefone" id="telefone" required>
            <br>
            <label for="data">date</label>
            <input type="date" name="data" id="data" required>
            <br>
            <label for="hora">hora</label>
            <input type="time" name="hora" id="hora" required>
            <br>
            <label for="especialidades">especialidades</label>
            <select name="especialidades" id="especialidades">
                <option value="">selecione uma opção</option>
                <option value="Clínico-geral">Clínico geral</option>
                <option value="Cardiologia">Cardiologia</option>
                <option value="dermatologia">dermatologia</option>
                <option value="pediatria">pediatria</option>
            </select>
            <br>
            <label for="Mensagem">Mensagem</label>
            <textarea name="Mensagem" id="Mensagem" rows="4"></textarea>
            <br>
            <button type="submit">confirmar agendamento</button>
        </form>
    </main>
    <footer>
        <p></p>
    </footer>
</body>

</html>
